# For details of what checks are run for PRs please refer below
# docs: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: npm-ls demo results

on:
  workflow_dispatch:

permissions: {}

env:
  DEMO_ROOT_DIR: demo
  RESULTS_DIR: CI_results
  RESULTS_ARTIFACT: npm-ls-results

jobs:
  demo-results:
    name: '${{ matrix.subject }} ${{matrix.additional_npm-ls_args}} | npm${{ matrix.npm-version }} node${{ matrix.node-version }} ${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # gather all the results !
      matrix:
        subject:
          - deps-from-git
          - alternative-package-registry
          - bundled-dependencies
          - dev-dependencies
          - juice-shop
          - local-dependencies
          - local-workspaces
          - package-integrity
          - package-with-build-id
        additional_npm-ls_args: [ '' ]
        npm-version:
          ## see https://www.npmjs.com/package/npm?activeTab=versions
          ## see also: https://github.com/npm/cli/releases
          - '12'     # Current
          - '11'
          # - '10'
          # - '9'      # Lowest supported
        node-version:
          ## action based on https://github.com/actions/node-versions/releases
          ## see also: https://nodejs.org/en/about/releases/
          - '26'     # Current
          - '24'     # Active LTS
          - '22'
          - '20'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - subject: local-workspaces
            additional_npm-ls_args: '--workspace=my-local-e'
            npm-version: '12'   # Current
            node-version: '24'  # LTS
            os: ubuntu-latest
          - subject: local-workspaces
            additional_npm-ls_args: '--workspace=my-local --workspace=my-local-e'
            npm-version: '12'   # Current
            node-version: '24'  # LTS
            os: ubuntu-latest
          - subject: local-workspaces
            additional_npm-ls_args: '--no-workspaces'
            npm-version: '12'   # Current
            node-version: '24'  # LTS
            os: ubuntu-latest
        exclude:
          - # npm12 requires node ^22.22.2 || ^24.15.0 || >=26.0.0
            npm-version: '12'
            node-version: '20'
          - # our specific version of juice-shop might not be node22 compatible
            subject: juice-shop
            node-version: '22'
          - # git-foo seams bugged in windows
            subject: deps-from-git
            os: windows-latest
          - # git-foo seams bugged in macos
            subject: deps-from-git
            os: macos-latest
    env:
      ADDITIONAL_NPM_LS_ARGS: ${{ matrix.additional_npm-ls_args || '' }}
      NPM_VERSION: ${{ matrix.npm-version }}
      NODE_VERSION: ${{ matrix.node-version }}
      OS: ${{ matrix.os }}
    timeout-minutes: 10 # this is a large matrix, just don't waste time!
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: prepare output
        run: |
          mkdir -p "$RESULTS_DIR"
          echo "OUT_FILE_PREFIX=${RESULTS_DIR}/npm-ls${ADDITIONAL_NPM_LS_ARGS}_npm${NPM_VERSION}_node${NODE_VERSION}_${OS}" >> "$GITHUB_ENV"
        working-directory: '${{ env.DEMO_ROOT_DIR}}/${{ matrix.subject }}'
        shell: bash # don't want to write tht code twice, windows and unix-like
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        # see https://github.com/actions/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          package-manager-cache: false
      - name: up-/down-grade npm to ${{ env.NPM_VERSION }}
        run: npm i -g "npm@${NPM_VERSION}"  # zizmor: ignore[adhoc-packages] -- global npm
      - name: report versions
        run: |
          node --version
          npm  --version
      - name: setup demo
        run: npm i --no-audit --no-fund --ignore-scripts
        working-directory: ${{ env.DEMO_ROOT_DIR }}/${{ matrix.subject }}/project
      - name: npm-ls --json --all --long
        # important: the command in use is the same used by the internal builders of this project
        shell: bash
        run: >
          npm --prefix project
          ls --json --all --long
          ${ADDITIONAL_NPM_LS_ARGS}
          2> "${OUT_FILE_PREFIX}.err.log"
          1> "${OUT_FILE_PREFIX}.json"
        working-directory: '${{ env.DEMO_ROOT_DIR}}/${{ matrix.subject }}'
      - name: Artifact RESULTS
        # see https://github.com/actions/upload-artifact
        if: ${{ ! cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ env.RESULTS_ARTIFACT }}_${{ matrix.subject }}${{ env.ADDITIONAL_NPM_LS_ARGS }}_npm${{ env.NPM_VERSION }}_node${{ env.NODE_VERSION }}_${{ env.OS }}'
          path: '${{ env.DEMO_ROOT_DIR}}/*/${{ env.RESULTS_DIR }}'
          if-no-files-found: error
          retention-days: 3

  combine-results:
    name: combine results
    needs: [ 'demo-results' ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: fetch and combine RESULTS
        # see https://github.com/actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '${{ env.RESULTS_ARTIFACT }}_*'
          merge-multiple: true
          path: '${{ env.DEMO_ROOT_DIR}}'
      - name: Artifact RESULTS
        # see https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: '${{ env.RESULTS_ARTIFACT }}-combined'
          path: '${{ env.DEMO_ROOT_DIR}}'
          if-no-files-found: error
          retention-days: 3
